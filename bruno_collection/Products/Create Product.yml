info:
  name: Create Product
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/products"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Fullstack JavaScript Book",
        "price": 49.99,
        "stripeProductId": "prod_V63bpA1h7XozvZ"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Create a new product with optional stripeProductId
