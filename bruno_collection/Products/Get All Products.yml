info:
  name: Get All Products
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1/products?take=10&skip=0"
  params:
    - name: take
      value: "10"
      type: query
      description: Number of products to retrieve
    - name: skip
      value: "0"
      type: query
      description: Number of products to skip
    - name: search
      value: Book
      type: query
      description: Filter products by name substring
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Retrieve list of all products with optional pagination and name search
