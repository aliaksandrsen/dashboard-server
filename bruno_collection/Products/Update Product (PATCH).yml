info:
  name: Update Product (PATCH)
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/v1/products/{{productId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "price": 39.99
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Partially update product properties (name, price, or stripeProductId)
