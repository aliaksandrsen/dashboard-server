info:
  name: Update Order (PATCH)
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/v1/orders/{{orderId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "total": 249.99,
        "userId": 1,
        "productIds": [
          "34d05e33-a69e-410c-8ad1-6bb3481711d1",
          "9eea332a-8c1b-4a0c-bee1-c97ba80f3308"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Partially update an order (total, user, or replace product list)
