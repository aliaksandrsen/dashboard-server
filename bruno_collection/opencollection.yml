opencollection: 1.0.0

info:
  name: Dashboard Server API

request:
  variables:
    - name: baseUrl
      value: http://localhost:3000
    - name: orderId
      value: '1'
    - name: productId
      value: 34d05e33-a69e-410c-8ad1-6bb3481711d1
    - name: userId
      value: '1'

docs:
  content: REST API collection for Dashboard Server (Users, Products & Orders CRUD, Stripe Payments, Cron Jobs)
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
