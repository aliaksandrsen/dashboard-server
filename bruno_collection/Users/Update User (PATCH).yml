info:
  name: Update User (PATCH)
  type: http
  seq: 4

http:
  method: PATCH
  url: '{{baseUrl}}/v1/users/{{userId}}'
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "address": "456 Elm Avenue, Apt 12"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Partially update user information (name, address, or email)
