info:
  name: Create User
  type: http
  seq: 3

http:
  method: POST
  url: '{{baseUrl}}/v1/users'
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "alex.smith@example.com",
        "name": "Alex Smith",
        "address": "123 Main Street, Suite 4B"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Create a new user with unique email
